<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Lines of tetrahedron -->
  <!-- Top dot to bottom-left -->
  <line x1="100" y1="18" x2="38" y2="158" stroke="#1a2456" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top dot to bottom-right -->
  <line x1="100" y1="18" x2="162" y2="158" stroke="#1a2456" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top dot to center -->
  <line x1="100" y1="18" x2="100" y2="110" stroke="#1a2456" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-left to bottom-right -->
  <line x1="38" y1="158" x2="162" y2="158" stroke="#1a2456" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-left to center -->
  <line x1="38" y1="158" x2="100" y2="110" stroke="#1a2456" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-right to center -->
  <line x1="162" y1="158" x2="100" y2="110" stroke="#1a2456" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dots -->
  <circle cx="100" cy="18" r="9" fill="#1a2456"/>
  <circle cx="38" cy="158" r="9" fill="#1a2456"/>
  <circle cx="162" cy="158" r="9" fill="#1a2456"/>
  <circle cx="100" cy="110" r="9" fill="#1a2456"/>

  <!-- NEBULA text -->
  <text x="100" y="205" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" font-size="32" font-weight="700" letter-spacing="8" fill="#1a2456">NEBULA</text>
</svg>
